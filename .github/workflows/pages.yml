name: Déploiement GitHub Pages

# Ce dépôt sert aujourd'hui GitHub Pages depuis la branche gh-pages
# (Settings → Pages → Source : « Deploy from a branch »). Tant que ce réglage
# n'est pas passé sur « GitHub Actions », ce workflow ne peut pas déployer :
# il est donc en lancement manuel uniquement, pour ne pas échouer à chaque push.
# Une fois le réglage changé, remettre le déclencheur ci-dessous :
#
#   push:
#     branches: [main]
#
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
